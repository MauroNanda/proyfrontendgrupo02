name: Frontend CI/CD
permissions:
  contents: read

on:
  push:
    branches: [ "main", "develop", "demo/a8-despliegue" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    name: Integración Continua (CI)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: '0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: |
          node scripts/verificar-origen-dependencias.cjs
          npm ci --allow-remote=root

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run linter
        run: npm run lint --if-present

      - name: Run tests
        run: npm run test --if-present -- --watch=false

      - name: Build application
        run: npm run build

      - name: Build Docker Image (Validación Actividad 7)
        run: docker build -f Dockerfile.production -t app-frontend:latest .
